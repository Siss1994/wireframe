<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagram Editor - Flowchart, Sequence, State, Mindmap</title>
    <link rel="stylesheet" href="diagram-style.css">
</head>
<body>
    <div class="app-container">
        <!-- 헤더 -->
        <header class="app-header">
            <div class="header-left">
                <h1>Diagram Editor</h1>
                <span class="subtitle">코드로 다이어그램을 그려보세요</span>
            </div>
            <div class="header-right">
                <a href="DOCS.md" target="_blank" class="doc-link">문서 보기</a>
            </div>
        </header>

        <!-- 다이어그램 타입 선택 -->
        <nav class="diagram-tabs">
            <button class="tab-btn active" data-type="flowchart">
                <span class="tab-icon">&#9679;</span>
                Flowchart
            </button>
            <button class="tab-btn" data-type="sequence">
                <span class="tab-icon">&#8660;</span>
                Sequence
            </button>
            <button class="tab-btn" data-type="state">
                <span class="tab-icon">&#9673;</span>
                State
            </button>
            <button class="tab-btn" data-type="mindmap">
                <span class="tab-icon">&#10042;</span>
                Mindmap
            </button>
            <button class="tab-btn" data-type="pie">
                <span class="tab-icon">&#9684;</span>
                Pie
            </button>
            <button class="tab-btn" data-type="class">
                <span class="tab-icon">&#9633;</span>
                Class
            </button>
            <button class="tab-btn" data-type="er">
                <span class="tab-icon">&#9707;</span>
                ER
            </button>
            <button class="tab-btn" data-type="gantt">
                <span class="tab-icon">&#9776;</span>
                Gantt
            </button>
            <button class="tab-btn" data-type="journey">
                <span class="tab-icon">&#10140;</span>
                Journey
            </button>
        </nav>

        <!-- 메인 콘텐츠 -->
        <main class="main-content">
            <!-- 에디터 패널 -->
            <div class="editor-panel">
                <div class="panel-header">
                    <h2>코드 에디터</h2>
                    <div class="panel-actions">
                        <button id="formatBtn" class="btn btn-icon" title="코드 정리">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="21" y1="10" x2="3" y2="10"></line>
                                <line x1="21" y1="6" x2="3" y2="6"></line>
                                <line x1="21" y1="14" x2="3" y2="14"></line>
                                <line x1="21" y1="18" x2="3" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <div class="line-numbers" id="lineNumbers"></div>
                    <textarea id="codeEditor" spellcheck="false" placeholder="여기에 다이어그램 코드를 입력하세요..."></textarea>
                </div>
                <div class="editor-footer">
                    <span class="status" id="editorStatus">준비됨</span>
                    <div class="editor-actions">
                        <button id="renderBtn" class="btn btn-primary">
                            <span>렌더링</span>
                            <kbd>Ctrl+Enter</kbd>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 미리보기 패널 -->
            <div class="preview-panel">
                <div class="panel-header">
                    <h2>미리보기</h2>
                    <div class="panel-actions">
                        <button id="zoomOutBtn" class="btn btn-icon" title="축소">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                <line x1="8" y1="11" x2="14" y2="11"></line>
                            </svg>
                        </button>
                        <span id="zoomLevel" class="zoom-level">100%</span>
                        <button id="zoomInBtn" class="btn btn-icon" title="확대">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                <line x1="11" y1="8" x2="11" y2="14"></line>
                                <line x1="8" y1="11" x2="14" y2="11"></line>
                            </svg>
                        </button>
                        <button id="resetZoomBtn" class="btn btn-icon" title="원래 크기">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
                                <path d="M1 4v6h6"></path>
                            </svg>
                        </button>
                        <div class="divider"></div>
                        <button id="exportSvgBtn" class="btn btn-secondary">SVG 저장</button>
                        <button id="exportPngBtn" class="btn btn-secondary">PNG 저장</button>
                    </div>
                </div>
                <div class="preview-wrapper" id="previewWrapper">
                    <div id="diagramCanvas" class="diagram-canvas"></div>
                </div>
            </div>
        </main>

        <!-- 예제 모달 -->
        <div class="examples-sidebar" id="examplesSidebar">
            <div class="sidebar-header">
                <h3>예제 템플릿</h3>
                <button id="closeSidebar" class="btn btn-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="examples-list" id="examplesList">
                <!-- 동적으로 생성됨 -->
            </div>
        </div>

        <!-- 예제 토글 버튼 -->
        <button id="toggleExamples" class="toggle-examples-btn" title="예제 보기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14,2 14,8 20,8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <span>예제</span>
        </button>

        <!-- 문법 도움말 툴팁 -->
        <div class="syntax-help" id="syntaxHelp">
            <div class="help-header">
                <span>문법 도움말</span>
                <button id="closeSyntaxHelp" class="btn btn-icon btn-small">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="help-content" id="syntaxHelpContent">
                <!-- 동적으로 생성됨 -->
            </div>
        </div>

        <button id="toggleSyntaxHelp" class="toggle-syntax-btn" title="문법 도움말">?</button>
    </div>

    <script src="diagram-parser.js"></script>
    <script src="diagram-renderer.js"></script>
    <script src="diagram-app.js"></script>
</body>
</html>
